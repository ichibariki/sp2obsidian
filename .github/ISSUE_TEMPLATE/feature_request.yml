name: 機能の要望 / Feature request
description: こうなるとうれしい、という要望 / Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        要望ありがとうございます。**Issue は誰でも見られます。** Client ID・トークン・取得したデータは貼らないでください。
        Thank you for the suggestion. **Issues are public.** Do not paste your Client ID, tokens, or fetched data.

        対応するかどうかは作者が判断します。個人が趣味で作っているツールのため、対応の時期はお約束できません。
        Whether to implement it is up to the author. This is a personal hobby project; no timeline is guaranteed.
  - type: textarea
    id: idea
    attributes:
      label: 要望の内容 / What you would like
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・困っていること / Why it would help
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認 / Confirmation
      options:
        - label: Client ID・トークン・`.env` の中身・取得したデータを貼っていません / I have not included my Client ID, tokens, `.env` contents, or fetched data
          required: true
